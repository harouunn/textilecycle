# =============================================================================
#  TexTileCycle : Apache (XAMPP) devant Laravel, pour un site rapide en local
# =============================================================================
#  - Apache sert lui-même les fichiers statiques de public/ (CSS, JS, images, polices) :
#    en parallèle, compressés (gzip) et mis en cache par le navigateur.
#  - Les pages PHP sont transmises à Laravel (php artisan serve, PHP 8.3) sur le port 8000.
#  Lancement : demarrer-site.bat (à la racine du projet), puis http://localhost:8080
#  ServerRoot = dossier du projet (passé par -d), les modules viennent de XAMPP.
# =============================================================================

Define XAMPP "C:/xampp/apache"

LoadModule authz_core_module "${XAMPP}/modules/mod_authz_core.so"
LoadModule mime_module "${XAMPP}/modules/mod_mime.so"
LoadModule dir_module "${XAMPP}/modules/mod_dir.so"
LoadModule log_config_module "${XAMPP}/modules/mod_log_config.so"
LoadModule setenvif_module "${XAMPP}/modules/mod_setenvif.so"
LoadModule rewrite_module "${XAMPP}/modules/mod_rewrite.so"
LoadModule proxy_module "${XAMPP}/modules/mod_proxy.so"
LoadModule proxy_http_module "${XAMPP}/modules/mod_proxy_http.so"
LoadModule headers_module "${XAMPP}/modules/mod_headers.so"
LoadModule expires_module "${XAMPP}/modules/mod_expires.so"
LoadModule filter_module "${XAMPP}/modules/mod_filter.so"
LoadModule deflate_module "${XAMPP}/modules/mod_deflate.so"

Listen 127.0.0.1:8080
ServerName localhost:8080
PidFile "storage/logs/apache.pid"
ErrorLog "storage/logs/apache-erreurs.log"
LogLevel warn
TypesConfig "${XAMPP}/conf/mime.types"
ThreadsPerChild 64
EnableSendfile on
EnableMMAP on

DocumentRoot "public"
<Directory "public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Fichiers statiques : servis par Apache. Tout le reste (pages, formulaires) : Laravel.
RewriteEngine On
RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}" !-f
RewriteRule "^/(.*)$" "http://127.0.0.1:8000/$1" [P,L,QSA]
ProxyPreserveHost On
ProxyPassReverse "/" "http://127.0.0.1:8000/"
ProxyTimeout 120

# Compression gzip des textes
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml

# Cache navigateur : 30 jours pour images et polices, 7 jours pour CSS/JS
# (les liens du site contiennent ?v=<date du fichier> : une modification est prise en compte tout de suite).
ExpiresActive On
ExpiresByType image/jpeg "access plus 30 days"
ExpiresByType image/png "access plus 30 days"
ExpiresByType image/webp "access plus 30 days"
ExpiresByType image/svg+xml "access plus 30 days"
ExpiresByType image/x-icon "access plus 30 days"
ExpiresByType font/woff2 "access plus 30 days"
ExpiresByType text/css "access plus 7 days"
ExpiresByType application/javascript "access plus 7 days"
ExpiresByType text/javascript "access plus 7 days"
Header append Cache-Control "public" "expr=%{REQUEST_URI} =~ m#\.(css|js|woff2|jpe?g|png|webp|svg|ico)$#"
